


<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
    <link rel="icon" href="images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
    <script type="text/javascript">
        (function(){
        emailjs.init({
        publicKey: "9oABz35lVwLPilESN",
        });
    })();
    </script>
    <script src="contactus.js"></script>
</head>
<body>
    <div class="container">
        <form onsubmit="sendEmail(); reset(); return false;">
            <a href="index.html">BACK</a>
            <h2>Contact Us</h2>
            <input type="text" id="name" placeholder="Name">
            <input type="text" id="email" placeholder="Email">
            <input type="text" id="phone" placeholder="Phone No.">

            <textarea id="message" rows="5" placeholder="Message..."></textarea>
            <button type="submit" onclick="sendEmail()" >Submit</button>

        </form>
    </div>
<br><br>
    <footer>
        <p>Email: <strong>Barkbershop@gmail.com</strong></p>
        <p>Contact No: <strong>09813245297</strong></p>
        <p style="color:#aaa;">The Barkber Shop © 2026</p>
    </footer>

</body>

</html>

<style>
    @media screen and (max-width: 768px) {
    body{
        font-size: 14px;
    }
    p{
        font-size: 14px;
    }
    a{
        font-size: 14px
    }
    h2{
        font-size: 24px;
    }
}

body{
    background-color: #D8DDDD;
    box-sizing: border-box;
    font-family: 'Poppins';
}
.container{
    margin-top: 50px;
    text-align: center;
    align-items: center; 
    width: 100%;
    display: flex;
    justify-content: center;
    height: 80vh;
}
.container a{
    width: 50px;
    text-align: left;
    text-decoration: none;
    color: black;
    font-weight: bold;
}
.container a:hover{

    text-decoration: underline;
}
form{
    background-color: beige;
    border: 3px solid black;
    display: flex;
    flex-direction: column;
    padding: 2vw 4vw;
    width: 90%;
    max-width: 600px;
    border-radius: 10px;
}
form input, form textarea{
    border: 1px solid black;
    margin: 10px 0;
    padding: 20px;
    outline: none;
    border-radius: 7px;
}

form button{
    cursor: pointer;
    font-size: medium;
    font-weight: bold;
    padding: 15px;
    border-radius: 10px;
    border: none;
    background-color: #fff7f7;
    width: 180px;
    margin: 20px auto;


}
form button:hover{
    border: 1px solid black;

}
:placeholder-shown{
    font-weight: bold;
    font-size: medium;
}
</style>
